arena.help-header: "&7Управление аренами:"
arena.help:
  - "&e/pbot arena create <название> <набор>"
  - "&e/pbot arena setplayer <название> &7- спавн игрока (где вы стоите)"
  - "&e/pbot arena setbot <название> &7- спавн бота (где вы стоите)"
  - "&e/pbot arena addspawn <название> &7- ещё одна случайная пара спавнов (выполните дважды: позиция игрока, затем бота)"
  - "&e/pbot arena clearspawns <название> &7- удаляет дополнительные пары спавнов"
  - "&e/pbot arena setkit <название> <набор>"
  - "&e/pbot arena info <название> &7- показывает следующий шаг настройки"
  - "&e/pbot arena delete <название>"
  - "&e/pbot arena list &7| &e/pbot arena tp <название>"
