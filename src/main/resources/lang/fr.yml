  - "&e/pbot arena ... &7- gestion des arènes"
  - "&e/pbot reload"
kits.header: "&7Kits :"
kits.line: "&e{id} &7- {desc} &8(arènes : {count})"
arena.help-header: "&7Administration des arènes :"
arena.help:
  - "&e/pbot arena create <nom> <kit>"
  - "&e/pbot arena setplayer <nom> &7- spawn du joueur (là où vous êtes)"
  - "&e/pbot arena setbot <nom> &7- spawn du bot (là où vous êtes)"
  - "&e/pbot arena addspawn <nom> &7- paire de spawns aléatoire supplémentaire (à utiliser deux fois : position du joueur, puis du bot)"
  - "&e/pbot arena clearspawns <nom> &7- supprime les paires supplémentaires"
  - "&e/pbot arena setkit <nom> <kit>"
  - "&e/pbot arena info <nom> &7- affiche la prochaine étape de configuration"
  - "&e/pbot arena delete <nom>"
  - "&e/pbot arena list &7| &e/pbot arena tp <nom>"
