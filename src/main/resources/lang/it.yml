arena.help-header: "&7Amministrazione arene:"
arena.help:
  - "&e/pbot arena create <nome> <kit>"
  - "&e/pbot arena setplayer <nome> &7- spawn del giocatore (dove ti trovi)"
  - "&e/pbot arena setbot <nome> &7- spawn del bot (dove ti trovi)"
  - "&e/pbot arena addspawn <nome> &7- altra coppia di spawn casuale (da eseguire due volte: posizione del giocatore, poi del bot)"
  - "&e/pbot arena clearspawns <nome> &7- rimuove le coppie di spawn extra"
  - "&e/pbot arena setkit <nome> <kit>"
  - "&e/pbot arena info <nome> &7- mostra il prossimo passo della configurazione"
  - "&e/pbot arena delete <nome>"
  - "&e/pbot arena list &7| &e/pbot arena tp <nome>"
