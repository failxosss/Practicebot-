name: PracticeBot
version: ${project.version}
main: dev.practicebot.PracticeBotPlugin
api-version: '1.21'
description: Practice bot that behaves like a real player. Kits, difficulties, arenas and isolated fights.
author: Failxos
depend: [Citizens]

commands:
  pbot:
    description: Main PracticeBot command
    aliases: [practicebot, pb]
    usage: /<command> [play|leave|kits|arena|reload]

permissions:
  practicebot.play:
    description: Use the GUI and /pbot play
    default: true
  practicebot.admin:
    description: Manage arenas and reload the plugin
    default: op
