help.header: "&7PracticeBot commands:"
help.player:
  - "&e/pbot &7- opens the GUI"
  - "&e/pbot play <kit> <difficulty> &7- quick start"
  - "&e/pbot leave &7- ends the fight"
  - "&e/pbot kits &7- list of kits"
  - "&e/pbot stats [player] &7- win/loss stats"
  - "&e/pbot top &7- leaderboard"
help.admin:
  - "&e/pbot arena ... &7- arena management"
  - "&e/pbot reload"
kits.header: "&7Kits:"
kits.line: "&e{id} &7- {desc} &8(arenas: {count})"
arena.help-header: "&7Arena admin:"
arena.help:
  - "&e/pbot arena create <name> <kit>"
  - "&e/pbot arena setplayer <name> &7- player spawn (where you stand)"
  - "&e/pbot arena setbot <name> &7- bot spawn (where you stand)"
  - "&e/pbot arena addspawn <name> &7- extra random spawn pair (run twice: player spot, then bot spot)"
  - "&e/pbot arena clearspawns <name> &7- remove extra spawn pairs"
  - "&e/pbot arena setkit <name> <kit>"
  - "&e/pbot arena info <name> &7- shows the next setup step"
  - "&e/pbot arena delete <name>"
  - "&e/pbot arena list &7| &e/pbot arena tp <name>"
arena.none: "&7No arenas yet."
arena.list-line: "&e{name} &7- kit &b{kit} &7- world &f{world} &7- spawns &f{spawns} &7- {status}"
arena.ready: "&aready"
arena.unfinished: "&cnot finished"
arena.info: "&7Arena &e{name}&7 | kit &b{kit} &7| player spawn: {player} &7| bot spawn: {bot} &7| spawn pairs: &f{spawns}"
