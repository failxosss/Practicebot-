# ===== PracticeBot =====
# Internal version, do not change. An older config.yml is backed up to config-old.yml automatically.
config-version: 3

# Language of all messages and menus. Available:
#  en, cs, sk, de, es, fr, it, pt, pl, ru, uk, nl, sv, tr, ja, ko, zh, hu, ro, da
# The files are in plugins/PracticeBot/lang/ - you can edit them (missing keys fall back to the built-in text).
# Use /pbot reload after changing anything there.
language: en

# Show a sidebar (time, bot HP, your HP, your CPS, win streak) during a fight
scoreboard: true

# Countdown before the fight starts (seconds)
countdown-seconds: 3

# Name shown above the bot's head. Use {difficulty} for the difficulty. Colors with &
bot-name: "&cBot &7({difficulty})"

# Bot skin (nickname of a player with an existing skin). Empty = default skin.
bot-skin: ""

# Commands allowed during a fight (besides /pbot)
allowed-commands: []

# Bot movement
#  bot-sprint              - the bot sprints like a real player (sprint hits give extra knockback)
#  sprint-speed-multiplier - sprint speed relative to walking (vanilla = 1.3)
#  bot-chase-jump          - the bot bunny-hops (sprint-jumps) while running toward you
bot-sprint: true
sprint-speed-multiplier: 1.3
bot-chase-jump: true

# Difficulty tuning
#  reach          - distance from which the bot attacks (blocks)
#  cps            - how many times per second the bot tries to hit
#  accuracy       - chance that an attempt connects (0.0 - 1.0)
#  speed          - walking speed multiplier (sprinting multiplies it by sprint-speed-multiplier)
#  strafe-chance  - chance that the bot strafes around the player
#  jump-chance    - chance per tick to jump (when on the ground and off cooldown), in a fight and while chasing
#  heal-below     - HP below which the bot heals (NoDebuff/Gapple kit)
#  heal-cooldown  - pause between heals (seconds)
difficulties:
  NORMAL:
    reach: 2.8
    cps: 4.0
    accuracy: 0.50
    speed: 0.85
    strafe-chance: 0.3
    jump-chance: 0.03
    heal-below: 6.0
    heal-cooldown: 6.0
  MEDIUM:
    reach: 3.0
    cps: 6.0
    accuracy: 0.65
    speed: 0.90
    strafe-chance: 0.5
    jump-chance: 0.05
    heal-below: 7.0
    heal-cooldown: 5.0
  HARD:
    reach: 3.2
    cps: 8.0
    accuracy: 0.80
    speed: 0.95
    strafe-chance: 0.7
    jump-chance: 0.08
    heal-below: 8.0
    heal-cooldown: 4.0
  PROFESSIONAL:
    reach: 3.4
    cps: 11.0
    accuracy: 0.92
    speed: 1.00
    strafe-chance: 0.9
    jump-chance: 0.12
    heal-below: 9.0
    heal-cooldown: 3.0

# Rewards (console commands). Placeholders: {player} {kit} {difficulty} {streak}
# Under on-win / on-loss use: ALL, a difficulty (NORMAL, MEDIUM, HARD, PROFESSIONAL) or a kit (SWORD, AXE, NODEBUFF, GAPPLE).
# Example:  PROFESSIONAL: ["give {player} diamond 1", "eco give {player} 500"]
rewards:
  enabled: false
  on-win:
    ALL: []
    NORMAL: []
    MEDIUM: []
    HARD: []
    PROFESSIONAL: []
  on-loss:
    ALL: []
