help.header: "&7Commandes de PracticeBot :"
help.player:
  - "&e/pbot &7- ouvre le menu"
  - "&e/pbot play <kit> <difficulté> &7- démarrage rapide"
  - "&e/pbot leave &7- termine le combat"
  - "&e/pbot kits &7- liste des kits"
  - "&e/pbot stats [joueur] &7- statistiques victoires/défaites"
  - "&e/pbot top &7- classement"
