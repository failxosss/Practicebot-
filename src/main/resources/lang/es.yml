arena.help-header: "&7Administración de arenas:"
arena.help:
  - "&e/pbot arena create <nombre> <kit>"
  - "&e/pbot arena setplayer <nombre> &7- spawn del jugador (donde estás)"
  - "&e/pbot arena setbot <nombre> &7- spawn del bot (donde estás)"
  - "&e/pbot arena addspawn <nombre> &7- otro par de spawns aleatorio (úsalo dos veces: posición del jugador, luego la del bot)"
  - "&e/pbot arena clearspawns <nombre> &7- elimina los pares de spawns extra"
  - "&e/pbot arena setkit <nombre> <kit>"
  - "&e/pbot arena info <nombre> &7- muestra el siguiente paso de la configuración"
  - "&e/pbot arena delete <nombre>"
  - "&e/pbot arena list &7| &e/pbot arena tp <nombre>"
